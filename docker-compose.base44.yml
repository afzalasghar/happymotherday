services:
  web:
    image: python:3.12-slim
    user: "0:0"
    restart: on-failure
    ports:
      - "3000:8000"
    volumes:
      - ./:/app:ro
    command: ["python", "-m", "http.server", "8000", "--directory", "/app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
